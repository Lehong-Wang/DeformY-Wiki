domains:
  general:
    - slug: gradient-descent
      title: "Gradient Descent"
      summary: "一阶优化算法家族，通过沿损失函数梯度的反方向迭代更新参数"
    - slug: backpropagation
      title: "Backpropagation"
      summary: "利用链式法则高效计算神经网络中各参数梯度的算法"
    - slug: regularization
      title: "Regularization"
      summary: "防止过拟合的技术家族，包括 L1/L2 正则化、dropout、早停等"
    - slug: cross-validation
      title: "Cross-Validation"
      summary: "将数据划分为训练集和验证集以评估模型泛化能力的方法"
    - slug: optimization
      title: "Optimization"
      summary: "机器学习中最小化损失函数的方法论，包括 SGD、Adam 等优化器"
  NLP:
    - slug: transformer
      title: "Transformer"
      summary: "基于自注意力机制的序列建模架构，取代 RNN 成为 NLP 主流"
    - slug: attention-mechanism
      title: "Attention Mechanism"
      summary: "允许模型动态关注输入不同部分的机制"
    - slug: recurrent-neural-networks
      title: "Recurrent Neural Networks"
      summary: "通过隐藏状态处理序列数据的神经网络架构，已被 Transformer 大幅取代"
    - slug: word-embeddings
      title: "Word Embeddings"
      summary: "将离散词语映射到连续向量空间的表示学习方法"
    - slug: sequence-to-sequence
      title: "Sequence-to-Sequence Models"
      summary: "编码器-解码器架构，用于变长输入到变长输出的映射"
    - slug: language-model
      title: "Language Model"
      summary: "学习文本概率分布的模型，是 GPT/BERT 等预训练模型的基础"
    - slug: tokenization
      title: "Tokenization"
      summary: "将文本切分为模型可处理的基本单元的方法"
    - slug: pre-training
      title: "Pre-training"
      summary: "在大规模无标注数据上学习通用表示的训练范式"
  CV:
    - slug: convolutional-neural-networks
      title: "Convolutional Neural Networks"
      summary: "利用卷积操作提取空间特征的神经网络架构"
    - slug: residual-connections
      title: "Residual Connections"
      summary: "通过跳跃连接缓解深层网络梯度消失的技术"
    - slug: batch-normalization
      title: "Batch Normalization"
      summary: "通过规范化中间层激活值加速训练的技术"
    - slug: generative-adversarial-networks
      title: "Generative Adversarial Networks"
      summary: "生成器和判别器对抗训练的生成模型框架"
    - slug: data-augmentation
      title: "Data Augmentation"
      summary: "通过对训练数据施加变换来增加数据多样性的技术"
    - slug: image-classification
      title: "Image Classification"
      summary: "将图像分配到预定义类别的视觉任务"
  RL:
    - slug: markov-decision-process
      title: "Markov Decision Process"
      summary: "强化学习的数学框架，定义状态、动作、转移和奖励"
    - slug: policy-gradient
      title: "Policy Gradient Methods"
      summary: "直接优化策略函数的强化学习方法族"
    - slug: q-learning
      title: "Q-Learning"
      summary: "学习状态-动作价值函数的无模型强化学习算法"
    - slug: reward-shaping
      title: "Reward Shaping"
      summary: "通过设计辅助奖励信号引导强化学习agent学习的技术"
  Robotics:
    # --- Robot learning paradigms ---
    - slug: imitation-learning
      title: "Imitation Learning"
      summary: "Learning a policy from expert demonstrations rather than explicit reward, including behavioral cloning, DAgger, and inverse RL."
    - slug: behavioral-cloning
      title: "Behavioral Cloning"
      summary: "Supervised regression from observation to expert action; the simplest imitation-learning baseline, prone to compounding distribution shift."
    - slug: diffusion-policy
      title: "Diffusion Policy"
      summary: "Visuomotor policy class that models multi-modal action distributions with conditional denoising diffusion, dominant for manipulation since 2023."
    - slug: visuomotor-policy
      title: "Visuomotor Policy"
      summary: "End-to-end policy mapping raw visual observations to robot actions, learned via imitation or RL."
    - slug: sim-to-real-transfer
      title: "Sim-to-Real Transfer"
      summary: "Techniques for deploying policies trained in simulation onto real robots despite the reality gap."
    - slug: domain-randomization
      title: "Domain Randomization"
      summary: "Sim-to-real strategy that varies physics, textures, and lighting during training so the policy treats reality as one more variation."
    - slug: model-based-reinforcement-learning
      title: "Model-Based Reinforcement Learning"
      summary: "RL paradigm that learns a forward dynamics model and plans or backprops through it for sample-efficient control."

    # --- Classical control + planning foundations ---
    - slug: model-predictive-control
      title: "Model Predictive Control"
      summary: "Receding-horizon optimal control: solve a finite-horizon problem each timestep using a dynamics model, apply the first action, replan."
    - slug: forward-kinematics
      title: "Forward Kinematics"
      summary: "Mapping joint configuration to end-effector pose via the kinematic chain."
    - slug: inverse-kinematics
      title: "Inverse Kinematics"
      summary: "Solving for joint configurations that achieve a desired end-effector pose; analytical or iterative (Jacobian-based)."
    - slug: jacobian-based-control
      title: "Jacobian-Based Control"
      summary: "Velocity/force control that uses the manipulator Jacobian to map task-space objectives to joint-space commands."
    - slug: impedance-control
      title: "Impedance Control"
      summary: "Control law that regulates the dynamic relationship (mass-spring-damper) between end-effector force and motion, key for contact-rich tasks."
    - slug: visual-servoing
      title: "Visual Servoing"
      summary: "Closed-loop control that drives a robot using image-feature error (image-based) or estimated pose error (position-based)."

    # --- Deformable / continuum modeling foundations ---
    - slug: deformable-linear-object
      title: "Deformable Linear Object"
      summary: "One-dimensional deformable bodies (rope, cable, suture, hose) whose configuration is dominated by bending and twisting along a centerline."
    - slug: cosserat-rod-theory
      title: "Cosserat Rod Theory"
      summary: "Continuum mechanics model for slender rods that captures bending, twisting, shear, and stretch of a directed centerline."
    - slug: discrete-elastic-rods
      title: "Discrete Elastic Rods"
      summary: "Discrete differential geometry formulation of Kirchhoff/Cosserat rods, widely used in graphics and robotics for fast DLO simulation."
    - slug: mass-spring-system
      title: "Mass-Spring System"
      summary: "Network of point masses connected by springs/dampers; the simplest deformable-object model, often used for ropes and cloth."
    - slug: finite-element-method
      title: "Finite Element Method"
      summary: "Discretization of continuum PDEs onto a mesh; used for high-fidelity deformable-body simulation including DLOs."
    - slug: position-based-dynamics
      title: "Position-Based Dynamics"
      summary: "Stable, real-time deformable-body simulation that solves geometric constraints directly on positions instead of forces."

    # --- Manipulation primitives ---
    - slug: shape-servoing
      title: "Shape Servoing"
      summary: "Closed-loop control that drives a deformable object's shape toward a target by estimating a deformation Jacobian online."
    - slug: grasping
      title: "Grasping"
      summary: "Selection and execution of stable contact configurations for picking up objects, foundational for any manipulation pipeline."
    - slug: contact-rich-manipulation
      title: "Contact-Rich Manipulation"
      summary: "Manipulation tasks dominated by making/breaking contact (insertion, wiping, knotting), where stiff control fails and force/impedance control matters."
    - slug: tactile-sensing
      title: "Tactile Sensing"
      summary: "Measurement of contact forces, pressures, and shear via skin-like sensors; central for manipulating slender, occluded, or deformable objects."
